description = "Brais Gabín personal website"
keywords = "blog,developer,personal"

#faviconSVG = "/img/favicon.svg"
#favicon_32 = "/img/favicon-32x32.png"
#favicon_16 = "/img/favicon-16x16.png"

colorScheme = "auto"

[taxonomies]
category = "categories"
series = "series"
tag = "tags"
author = "authors"

[[menu.main]]
name = "Blog"
weight = 1
url  = "posts/"
