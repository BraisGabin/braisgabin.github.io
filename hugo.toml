baseURL = 'https://braisgabin.github.io/'
locale = 'en-us'
title = 'Brais Gabín'
theme = 'coder'
languageCode = "en"
defaultContentLanguage = "en"
enableEmoji = true

[caches]
[caches.images]
dir = ':cacheDir/images'

[pagination]
pagerSize = 30

[markup]
[markup.highlight]
noClasses = false

[params]
author = "Brais Gabín"
footer = "This web doesn't have any LLM generated content"
