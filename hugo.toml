baseURL = 'https://braisgabin.com/'
locale = 'en'
title = 'Brais Gabín'
theme = 'coder'
defaultContentLanguage = "en"
enableEmoji = true

[caches]
[caches.images]
dir = ':cacheDir/images'

[pagination]
pagerSize = 30

[markup]
[markup.highlight]
noClasses = false

[params]
author = "Brais Gabín"
footer = "This web doesn't have any LLM generated content"
info = "Mobile developer & Board game enjoyer"
description = "Brais Gabín personal website"
keywords = "blog,developer,personal"

#faviconSVG = "/img/favicon.svg"
#favicon_32 = "/img/favicon-32x32.png"
#favicon_16 = "/img/favicon-16x16.png"

colorScheme = "auto"

[taxonomies]
category = "categories"
series = "series"
tag = "tags"
author = "authors"

[[menu.main]]
name = "Blog"
weight = 1
url  = "posts/"

[[params.social]]
name = "Github"
icon = "fa-brands fa-github fa-2x"
weight = 1
url = "https://github.com/BraisGabin/"
[[params.social]]
name = "Mastodon"
icon = "fa-brands fa-mastodon fa-2x"
weight = 2
url = "https://androiddev.social/@brais"
[[params.social]]
name = "RSS"
icon = "fa-solid fa-rss fa-2x"
weight = 3
url = "https://braisgabin.github.io/index.xml"
rel = "alternate"
type = "application/rss+xml"
